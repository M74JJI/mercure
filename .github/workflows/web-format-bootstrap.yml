name: Web formatting bootstrap

on:
  push:
    branches:
      - feature/web-platform-foundation
    paths:
      - .github/workflows/web-format-bootstrap.yml

permissions:
  contents: write

jobs:
  format:
    name: Apply canonical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format reviewed files
        run: >-
          pnpm exec prettier --write
          libs/platform/backend/presentation/src/lib/health.controller.ts
          libs/platform/frontend/api-client/src/lib/api-client.ts
          tools/openapi/generate-client.mjs

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add             libs/platform/backend/presentation/src/lib/health.controller.ts             libs/platform/frontend/api-client/src/lib/api-client.ts             tools/openapi/generate-client.mjs

          unexpected="$(git status --short --untracked-files=all | grep -vE '^(M | M|A |\?\?) (libs/platform/backend/presentation/src/lib/health\.controller\.ts|libs/platform/frontend/api-client/src/lib/api-client\.ts|tools/openapi/generate-client\.mjs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected repository changes during formatting:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name 'M74JJI'
          git config user.email '52024672+M74JJI@users.noreply.github.com'
          git commit -m 'fix:web:normalize-platform-formatting'
          git push origin HEAD:feature/web-platform-foundation
