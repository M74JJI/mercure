name: Rules API client diagnostic

on:
  pull_request:
    paths:
      - 'libs/modules/rules/backend/**'
      - 'apps/api/**'
      - 'tools/openapi/**'
      - 'libs/platform/frontend/api-client/src/generated/mercure-api.ts'
      - '.github/workflows/rules-api-client-diagnostic.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Generate API client
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm api:client:generate

      - name: Print generated API client
        shell: bash
        run: |
          echo 'BEGIN_MERCURE_API_BASE64'
          base64 -w0 libs/platform/frontend/api-client/src/generated/mercure-api.ts
          echo
          echo 'END_MERCURE_API_BASE64'
