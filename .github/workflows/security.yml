name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report full workspace dependency advisories
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Build pruned API runtime dependency graph
        run: pnpm db:generate && pnpm exec nx build api

      - name: Install deployable API dependencies
        working-directory: dist/apps/api
        run: pnpm install --prod --frozen-lockfile

      - name: Verify Prisma CLI-only packages are absent
        working-directory: dist/apps/api
        shell: bash
        run: |
          set -euo pipefail
          for pattern in 'prisma@*' '@prisma+config@*' 'deepmerge-ts@*' 'mysql2@*'; do
            if find node_modules/.pnpm -maxdepth 1 -mindepth 1 -name "$pattern" -print -quit | grep -q .; then
              echo "Unexpected non-runtime package present in API artifact: $pattern" >&2
              exit 1
            fi
          done

      - name: Audit deployable API dependencies
        working-directory: dist/apps/api
        run: >-
          pnpm audit --prod --audit-level high
          --ignore GHSA-ggr8-5vv4-36mx
          --ignore GHSA-3f6p-5ww8-9rcr

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
