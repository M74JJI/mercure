name: Next.js security lockfile

on:
  push:
    branches:
      - security/nextjs-critical-rce-patch

permissions:
  contents: write

jobs:
  generate:
    name: Generate Next.js security lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build:dependencies:update-nextjs-security-lockfile'
          git push origin HEAD:security/nextjs-critical-rce-patch
