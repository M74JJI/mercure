name: Rules API format diagnostic

on:
  pull_request:
    paths:
      - 'libs/modules/rules/backend/application/src/lib/query-ruleset-snapshots.ts'
      - 'libs/modules/rules/backend/feature/src/lib/rules-backend.module.ts'
      - 'libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-query-store.ts'
      - 'libs/modules/rules/backend/presentation/project.json'
      - 'libs/modules/rules/backend/presentation/src/lib/rules-snapshots.controller.ts'
      - 'libs/modules/rules/backend/presentation/src/lib/rules-snapshots.dto.ts'
      - 'libs/modules/rules/backend/presentation/tsconfig.lib.json'
      - '.github/workflows/rules-api-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  format-diagnostic:
    name: Format diagnostic
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write             libs/modules/rules/backend/application/src/lib/query-ruleset-snapshots.ts             libs/modules/rules/backend/feature/src/lib/rules-backend.module.ts             libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-query-store.ts             libs/modules/rules/backend/presentation/project.json             libs/modules/rules/backend/presentation/src/lib/rules-snapshots.controller.ts             libs/modules/rules/backend/presentation/src/lib/rules-snapshots.dto.ts             libs/modules/rules/backend/presentation/tsconfig.lib.json
          git diff --             libs/modules/rules/backend/application/src/lib/query-ruleset-snapshots.ts             libs/modules/rules/backend/feature/src/lib/rules-backend.module.ts             libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-query-store.ts             libs/modules/rules/backend/presentation/project.json             libs/modules/rules/backend/presentation/src/lib/rules-snapshots.controller.ts             libs/modules/rules/backend/presentation/src/lib/rules-snapshots.dto.ts             libs/modules/rules/backend/presentation/tsconfig.lib.json
          if ! git diff --quiet --             libs/modules/rules/backend/application/src/lib/query-ruleset-snapshots.ts             libs/modules/rules/backend/feature/src/lib/rules-backend.module.ts             libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-query-store.ts             libs/modules/rules/backend/presentation/project.json             libs/modules/rules/backend/presentation/src/lib/rules-snapshots.controller.ts             libs/modules/rules/backend/presentation/src/lib/rules-snapshots.dto.ts             libs/modules/rules/backend/presentation/tsconfig.lib.json; then
            exit 1
          fi
