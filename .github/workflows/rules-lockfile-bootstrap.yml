name: Rules lockfile bootstrap

on:
  push:
    branches:
      - feature/rules-migration-foundation
    paths:
      - .github/workflows/rules-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    name: Refresh Rules workspace lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Resolve lockfile only
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml

          unexpected="$(git status --short --untracked-files=all | grep -vE '^(M | M|A |\?\?) pnpm-lock\.yaml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected repository changes during Rules lockfile bootstrap:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name 'M74JJI'
          git config user.email '52024672+M74JJI@users.noreply.github.com'
          git commit -m 'build:rules:lock-parser-foundation'
          git push origin HEAD:feature/rules-migration-foundation
