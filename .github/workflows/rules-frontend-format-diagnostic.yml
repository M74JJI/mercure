name: Rules frontend format diagnostic

on:
  pull_request:
    paths:
      - 'apps/web/src/app/(platform)/rules/**'
      - 'libs/modules/rules/frontend/**'
      - '.github/workflows/rules-frontend-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  format-diagnostic:
    name: Format diagnostic
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print formatted files
        shell: bash
        run: |
          files=(
            "apps/web/src/app/(platform)/rules/[snapshotId]/page.tsx"
            "libs/modules/rules/frontend/data-access/src/lib/rules-api.spec.ts"
            "libs/modules/rules/frontend/data-access/src/lib/rules-api.ts"
            "libs/modules/rules/frontend/feature/src/index.ts"
            "libs/modules/rules/frontend/feature/src/lib/rules-overview-feature.tsx"
            "libs/modules/rules/frontend/feature/src/lib/rules-snapshot-feature.tsx"
            "libs/modules/rules/frontend/ui/src/index.ts"
            "libs/modules/rules/frontend/ui/src/lib/rules-snapshot-detail.tsx"
            "libs/modules/rules/frontend/ui/src/lib/rules-snapshot-history.tsx"
          )

          pnpm exec prettier --write "${files[@]}"

          for file in "${files[@]}"; do
            echo "BEGIN_FORMATTED_FILE:${file}"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:${file}"
          done
