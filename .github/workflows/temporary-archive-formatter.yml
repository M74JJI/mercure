name: Temporary archive formatter

on:
  push:
    branches: ['perf/rules-stream-archive-ingestion']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/rules-stream-archive-ingestion
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format archive implementation
        run: |
          pnpm exec prettier --write \
            libs/modules/rules/backend/infrastructure/src/lib/filesystem-manager-archive-source.ts \
            libs/modules/rules/backend/infrastructure/src/lib/filesystem-manager-archive-source.spec.ts
          rm .github/workflows/temporary-archive-formatter.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            libs/modules/rules/backend/infrastructure/src/lib/filesystem-manager-archive-source.ts \
            libs/modules/rules/backend/infrastructure/src/lib/filesystem-manager-archive-source.spec.ts \
            .github/workflows/temporary-archive-formatter.yml
          git commit -m "chore:rules:format-streaming-archive"
          git push origin HEAD:perf/rules-stream-archive-ingestion
