name: Temporary dependency metric formatter

on:
  push:
    branches: ['fix/rules-unresolved-dependency-metrics']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/rules-unresolved-dependency-metrics
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-store.integration.spec.ts \
            libs/modules/rules/backend/infrastructure/src/lib/rules-intelligence.spec.ts \
            libs/modules/rules/backend/infrastructure/src/lib/wazuh-xml-ruleset-analyzer.ts
          rm .github/workflows/temporary-dependency-metric-formatter.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-store.integration.spec.ts             libs/modules/rules/backend/infrastructure/src/lib/rules-intelligence.spec.ts             libs/modules/rules/backend/infrastructure/src/lib/wazuh-xml-ruleset-analyzer.ts             .github/workflows/temporary-dependency-metric-formatter.yml
          git commit -m "chore:rules:format-unresolved-dependency-metric"
          git push origin HEAD:fix/rules-unresolved-dependency-metrics
