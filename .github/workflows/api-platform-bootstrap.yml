name: API platform bootstrap

on:
  push:
    branches:
      - feature/api-platform-foundation
    paths:
      - .github/workflows/api-platform-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: api-platform-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap API platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM_ARCHIVE_B64: ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Materialize platform foundation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PLATFORM_ARCHIVE_B64" | base64 --decode > /tmp/platform-foundation.zip
          unzip -oq /tmp/platform-foundation.zip -d .

      - name: Resolve and install dependencies
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Format generated foundation
        run: pnpm format:write

      - name: Validate generated foundation
        run: |
          pnpm exec nx run-many -t lint --verbose
          pnpm typecheck
          pnpm build

      - name: Commit validated foundation
        shell: bash
        run: |
          set -euo pipefail
          git add .env.example apps/api apps/web/package.json libs/platform/backend pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'M74JJI'
          git config user.email '52024672+M74JJI@users.noreply.github.com'
          git commit -m 'feature:api:add-platform-foundation'
          git push origin HEAD:feature/api-platform-foundation
