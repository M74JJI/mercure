name: API platform bootstrap

on:
  push:
    branches:
      - feature/api-platform-foundation
    paths:
      - .github/workflows/api-platform-bootstrap.yml
      - scripts/ci/bootstrap-api-platform.py
      - scripts/ci/normalize-api-platform.py
      - package.json
      - pnpm-workspace.yaml

permissions:
  contents: write

concurrency:
  group: api-platform-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap API platform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Materialize platform foundation
        run: |
          python3 scripts/ci/bootstrap-api-platform.py
          python3 scripts/ci/normalize-api-platform.py

      - name: Resolve lockfile
        run: pnpm install --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format generated foundation
        run: pnpm format:write

      - name: Validate generated foundation
        shell: bash
        run: |
          set -euo pipefail
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm build
          scripts/ci/validate-repository-hygiene.sh

      - name: Commit validated foundation
        shell: bash
        run: |
          set -euo pipefail
          git add .env.example apps/api libs/platform/backend pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Platform foundation is already current.'
            exit 0
          fi
          unexpected="$(git status --short --untracked-files=all | grep -vE '^(A |M | M|\?\?) (\.env\.example|apps/api/|libs/platform/backend/|pnpm-lock\.yaml)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected repository changes during platform bootstrap:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'M74JJI'
          git config user.email '52024672+M74JJI@users.noreply.github.com'
          git commit -m 'feature:api:add-platform-foundation'
          git push origin HEAD:feature/api-platform-foundation
