name: Governance

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository hygiene
        run: scripts/ci/validate-repository-hygiene.sh

      - name: Validate branch name
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="$REF_NAME"
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            branch="$HEAD_REF"
          fi
          bash scripts/ci/validate-git-metadata.sh branch "$branch"

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/ci/validate-git-metadata.sh pr-title "$PR_TITLE"

      - name: Validate commit messages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            scripts/ci/validate-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
          else
            if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              export ALLOW_GITHUB_PR_MERGE_COMMITS=true
            else
              export COMMIT_POLICY_FALLBACK_BASE="origin/$DEFAULT_BRANCH"
            fi
            scripts/ci/validate-commit-messages.sh "$BEFORE_SHA" "$CURRENT_SHA"
          fi

      - name: Verify rewritten-history fallback
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          FALLBACK_BASE: origin/${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          COMMIT_POLICY_FALLBACK_BASE="$FALLBACK_BASE" \
            bash scripts/ci/validate-commit-messages.sh \
            ffffffffffffffffffffffffffffffffffffffff \
            "$HEAD_SHA"
