name: Rules M10 format diagnostic

on:
  pull_request:
    paths:
      - 'libs/modules/rules/backend/domain/project.json'
      - 'libs/modules/rules/backend/domain/src/lib/rules-analysis.spec.ts'
      - 'libs/modules/rules/backend/domain/src/lib/rules-diff.ts'
      - 'libs/modules/rules/backend/domain/src/lib/xml-roundtrip.ts'
      - 'libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-analysis-source.ts'
      - 'libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-store.integration.spec.ts'
      - '.github/workflows/rules-m10-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  format-diagnostic:
    name: Format diagnostic
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print formatted files
        shell: bash
        run: |
          files=(
            "libs/modules/rules/backend/domain/project.json"
            "libs/modules/rules/backend/domain/src/lib/rules-analysis.spec.ts"
            "libs/modules/rules/backend/domain/src/lib/rules-diff.ts"
            "libs/modules/rules/backend/domain/src/lib/xml-roundtrip.ts"
            "libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-analysis-source.ts"
            "libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-store.integration.spec.ts"
          )

          pnpm exec prettier --write "${files[@]}"

          for file in "${files[@]}"; do
            echo "BEGIN_FORMATTED_FILE:${file}"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:${file}"
          done
