name: Dependency lockfile update

on:
  push:
    branches:
      - feature/api-platform-foundation
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/dependency-lockfile-update.yml

permissions:
  contents: write

concurrency:
  group: dependency-lockfile-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: Update dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Resolve lockfile only
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          if [[ -n "$(git status --short --untracked-files=all | grep -v '^ M pnpm-lock.yaml$' || true)" ]]; then
            echo 'Unexpected repository changes during lockfile generation.' >&2
            git status --short
            exit 1
          fi
          git config user.name 'M74JJI'
          git config user.email '52024672+M74JJI@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build:dependencies:lock-api-platform-runtime'
          git push origin HEAD:feature/api-platform-foundation
