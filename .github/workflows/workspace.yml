name: Workspace

on:
  push:
    branches: ['**']
  pull_request:

# Bootstrap-only write permission. This is removed as soon as the generated
# lockfile and final formatter output are committed to the M1 branch.
permissions:
  contents: write

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Bootstrap dependencies and lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm format:write

      - name: Commit bootstrap artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/config/nx-workspace-foundation'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'M74JJI'
          git config user.email '52024672+M74JJI@users.noreply.github.com'

          created_commit=false

          git add apps/web/src/app/globals.css
          if ! git diff --cached --quiet; then
            git commit -m 'config:web:format-foundation-styles'
            created_commit=true
          fi

          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'build:dependencies:lock-workspace'
            created_commit=true
          fi

          if [[ "$created_commit" == 'true' ]]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
