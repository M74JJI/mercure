name: Workspace

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm exec nx run-many -t lint --verbose

      - name: Check generated API client contract
        run: pnpm api:client:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mercure:mercure-ci@127.0.0.1:5432/mercure
      DATABASE_DIRECT_URL: postgresql://mercure:mercure-ci@127.0.0.1:5432/mercure
      DATABASE_POOL_MAX: 5
      DATABASE_CONNECTION_TIMEOUT_MS: 2000
      DATABASE_IDLE_TIMEOUT_MS: 5000
      DATABASE_HEALTH_TIMEOUT_MS: 1500
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_CORS_ORIGINS: http://localhost:3000
      OPENAPI_ENABLED: 'false'
      RULES_MANAGER_ARCHIVE_DIR: /tmp/mercure-ci-missing-rules-source

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: mercure
          POSTGRES_USER: mercure
          POSTGRES_PASSWORD: mercure-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercure -d mercure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply migration history
        run: pnpm db:migrate:deploy

      - name: Verify Rules database integration
        env:
          RULES_PERSISTENCE_INTEGRATION: '1'
        run: >-
          pnpm exec vitest run
          libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-store.integration.spec.ts
          libs/modules/rules/backend/infrastructure/src/lib/prisma-rules-use-case-catalog.integration.spec.ts
          --config libs/modules/rules/backend/infrastructure/vitest.config.ts

      - name: Build API
        run: pnpm exec nx build api

      - name: Verify database-backed readiness
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec nx serve api > api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat api-smoke.log' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health/live >/dev/null &&
               curl --fail --silent http://127.0.0.1:3001/api/v1/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo 'API readiness smoke test timed out.' >&2
            exit 1
          fi

          curl --fail --silent             'http://127.0.0.1:3001/api/v1/rules/snapshots?offset=0&limit=1' >/dev/null

          invalid_uuid_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             'http://127.0.0.1:3001/api/v1/rules/snapshots/not-a-uuid')"
          [[ "$invalid_uuid_status" == "400" ]]

          missing_snapshot_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             'http://127.0.0.1:3001/api/v1/rules/snapshots/00000000-0000-4000-8000-000000000000')"
          [[ "$missing_snapshot_status" == "404" ]]

          unavailable_import_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             --request POST             'http://127.0.0.1:3001/api/v1/rules/snapshots/import')"
          [[ "$unavailable_import_status" == "503" ]]
