name: Workspace

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: mercure-ci-auth-secret-not-a-production-secret-000000
      AUTH_URL: https://mercure-ci.example.test
      AUTH_TRUST_HOST: 'true'
      AUTH_KEYCLOAK_ID: mercure-web-ci
      AUTH_KEYCLOAK_SECRET: ci-only-not-a-production-secret
      AUTH_KEYCLOAK_ISSUER: https://identity.example.test/realms/mercure
      WEB_AUTH_AUTHORITY_CLIENT_ID: mercure-api
      WEB_AUTH_ADMIN_AUTHORITIES: mercure-admin
      WEB_AUTH_USER_AUTHORITIES: mercure-user
      NEXT_PUBLIC_API_BASE_URL: https://api.example.test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm exec nx run-many -t lint --verbose

      - name: Check generated API client contract
        run: pnpm api:client:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify critical coverage
        run: pnpm test:coverage:critical

      - name: Build
        run: pnpm build

      - name: Prepare release artifacts
        run: pnpm release:prepare

      - name: Build production container images
        shell: bash
        run: |
          set -euo pipefail
          docker build --file deploy/production/api.Dockerfile --tag mercure-api:ci .
          docker build --file deploy/production/web.Dockerfile --tag mercure-web:ci .

      - name: Verify production containers run as non-root
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker image inspect --format '{{.Config.User}}' mercure-api:ci)" == "node" ]]
          [[ "$(docker image inspect --format '{{.Config.User}}' mercure-web:ci)" == "node" ]]

      - name: Set up pinned Chrome for browser smoke
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 153.0.8010.52

      - name: Smoke production web container
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          docker run --detach \
            --name mercure-web-smoke \
            --publish 127.0.0.1:3000:3000 \
            --env AUTH_SECRET="$AUTH_SECRET" \
            --env AUTH_URL="$AUTH_URL" \
            --env AUTH_TRUST_HOST="$AUTH_TRUST_HOST" \
            --env AUTH_KEYCLOAK_ID="$AUTH_KEYCLOAK_ID" \
            --env AUTH_KEYCLOAK_SECRET="$AUTH_KEYCLOAK_SECRET" \
            --env AUTH_KEYCLOAK_ISSUER="$AUTH_KEYCLOAK_ISSUER" \
            --env WEB_AUTH_AUTHORITY_CLIENT_ID="$WEB_AUTH_AUTHORITY_CLIENT_ID" \
            --env WEB_AUTH_ADMIN_AUTHORITIES="$WEB_AUTH_ADMIN_AUTHORITIES" \
            --env WEB_AUTH_USER_AUTHORITIES="$WEB_AUTH_USER_AUTHORITIES" \
            mercure-web:ci >/dev/null
          trap 'docker logs mercure-web-smoke 2>&1 || true; docker rm --force mercure-web-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/auth/sign-in >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "$ready" == "1" ]]

          sign_in_headers="$(mktemp)"
          sign_in_body="$(mktemp)"
          curl --fail --silent \
            --dump-header "$sign_in_headers" \
            --output "$sign_in_body" \
            http://127.0.0.1:3000/auth/sign-in

          csp="$(
            awk 'BEGIN { IGNORECASE=1 } /^content-security-policy:/ {
              sub(/^[^:]+:[[:space:]]*/, "")
              sub(/\r$/, "")
              print
              exit
            }' "$sign_in_headers"
          )"
          [[ -n "$csp" ]]

          script_policy="$(
            tr ';' '\n' <<<"$csp" |
              sed -n 's/^[[:space:]]*\(script-src [^;]*\)[[:space:]]*$/\1/p'
          )"
          [[ "$script_policy" == *"'nonce-"* ]]
          [[ "$script_policy" == *"'strict-dynamic'"* ]]
          [[ "$script_policy" != *"'unsafe-inline'"* ]]

          nonce="$(sed -n "s/.*'nonce-\([^']*\)'.*/\1/p" <<<"$script_policy")"
          [[ -n "$nonce" ]]
          grep -Fq "nonce=\"$nonce\"" "$sign_in_body"

          second_headers="$(mktemp)"
          curl --fail --silent --output /dev/null --dump-header "$second_headers" \
            http://127.0.0.1:3000/auth/sign-in
          second_csp="$(
            awk 'BEGIN { IGNORECASE=1 } /^content-security-policy:/ {
              sub(/^[^:]+:[[:space:]]*/, "")
              sub(/\r$/, "")
              print
              exit
            }' "$second_headers"
          )"
          second_script_policy="$(
            tr ';' '\n' <<<"$second_csp" |
              sed -n 's/^[[:space:]]*\(script-src [^;]*\)[[:space:]]*$/\1/p'
          )"
          second_nonce="$(sed -n "s/.*'nonce-\([^']*\)'.*/\1/p" <<<"$second_script_policy")"
          [[ -n "$second_nonce" ]]
          [[ "$nonce" != "$second_nonce" ]]

          root_headers="$(mktemp)"
          status="$(curl --silent --output /dev/null --dump-header "$root_headers" --write-out '%{http_code}' http://127.0.0.1:3000/)"
          [[ "$status" =~ ^30[2378]$ ]]
          grep -Eiq '^location: .*auth/sign-in' "$root_headers"
          grep -Eiq '^content-security-policy:' "$root_headers"

          rendered_dom="$(
            "$CHROME_PATH"               --headless=new               --disable-gpu               --disable-dev-shm-usage               --no-sandbox               --no-first-run               --dump-dom               http://127.0.0.1:3000/auth/sign-in
          )"
          grep -Fq 'Sign in to the security workspace' <<<"$rendered_dom"
          grep -Fq 'Authentication is delegated to the configured Keycloak identity provider.' <<<"$rendered_dom"

  database:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mercure:mercure-ci@127.0.0.1:5432/mercure
      DATABASE_DIRECT_URL: postgresql://mercure:mercure-ci@127.0.0.1:5432/mercure
      DATABASE_POOL_MAX: 5
      DATABASE_CONNECTION_TIMEOUT_MS: 2000
      DATABASE_IDLE_TIMEOUT_MS: 5000
      DATABASE_HEALTH_TIMEOUT_MS: 1500
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_CORS_ORIGINS: http://localhost:3000
      OPENAPI_ENABLED: 'false'
      RULES_MANAGER_ARCHIVE_DIR: /tmp/mercure-ci-missing-rules-source
      OIDC_ISSUER_URL: http://127.0.0.1:8080/realms/mercure-e2e
      OIDC_JWKS_URL: http://127.0.0.1:8080/realms/mercure-e2e/protocol/openid-connect/certs
      OIDC_AUDIENCE: mercure-api
      OIDC_CLIENT_ID: mercure-api
      OIDC_ADMIN_AUTHORITIES: admin
      OIDC_USER_AUTHORITIES: user

    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: mercure
          POSTGRES_USER: mercure
          POSTGRES_PASSWORD: mercure-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercure -d mercure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply migration history
        run: pnpm db:migrate:deploy

      - name: Verify Rules database integration
        env:
          RULES_PERSISTENCE_INTEGRATION: '1'
        run: >-
          pnpm exec vitest run
          libs/modules/rules/backend/infrastructure/src/lib/prisma-ruleset-snapshot-store.integration.spec.ts
          libs/modules/rules/backend/infrastructure/src/lib/postgres-ruleset-import-lease.integration.spec.ts
          libs/modules/rules/backend/infrastructure/src/lib/prisma-rules-intelligence-rate-limiter.integration.spec.ts
          libs/modules/rules/backend/infrastructure/src/lib/prisma-rules-use-case-catalog.integration.spec.ts
          libs/modules/rules/backend/infrastructure/src/lib/prisma-rules-authoring-store.integration.spec.ts
          --config libs/modules/rules/backend/infrastructure/vitest.config.ts

      - name: Build API
        run: pnpm exec nx build api

      - name: Prepare API production artifact
        run: pnpm release:prepare-api

      - name: Build API production image
        run: docker build --file deploy/production/api.Dockerfile --tag mercure-api:db-smoke .

      - name: Smoke API production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach             --name mercure-api-smoke             --network host             --env NODE_ENV=production             --env SERVICE_NAME=mercure-api             --env API_HOST=127.0.0.1             --env API_PORT=3011             --env API_CORS_ORIGINS=https://mercure-ci.example.test             --env DATABASE_URL="$DATABASE_URL"             --env DATABASE_POOL_MAX="$DATABASE_POOL_MAX"             --env DATABASE_CONNECTION_TIMEOUT_MS="$DATABASE_CONNECTION_TIMEOUT_MS"             --env DATABASE_IDLE_TIMEOUT_MS="$DATABASE_IDLE_TIMEOUT_MS"             --env DATABASE_HEALTH_TIMEOUT_MS="$DATABASE_HEALTH_TIMEOUT_MS"             --env OIDC_ISSUER_URL=https://identity.example.test/realms/mercure             --env OIDC_AUDIENCE=mercure-api             --env OIDC_CLIENT_ID=mercure-api             --env OIDC_ADMIN_AUTHORITIES=mercure-admin             --env OIDC_USER_AUTHORITIES=mercure-user             --env RULES_MANAGER_ARCHIVE_DIR=/tmp/mercure-ci-missing-rules-source             mercure-api:db-smoke >/dev/null
          trap 'docker logs mercure-api-smoke 2>&1 || true; docker rm --force mercure-api-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3011/api/v1/health/live >/dev/null &&
               curl --fail --silent http://127.0.0.1:3011/api/v1/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "$ready" == "1" ]]

          protected_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             'http://127.0.0.1:3011/api/v1/rules/snapshots?offset=0&limit=1')"
          [[ "$protected_status" == "401" ]]

      - name: Start disposable Keycloak
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name mercure-keycloak-e2e \
            --publish 127.0.0.1:8080:8080 \
            --volume "$PWD/tests/e2e/keycloak/mercure-realm.json:/opt/keycloak/data/import/mercure-e2e-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c \
            start-dev --import-realm >/dev/null

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent \
              http://127.0.0.1:8080/realms/mercure-e2e/.well-known/openid-configuration \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "$ready" == "1" ]]

      - name: Verify database-backed readiness and Keycloak authorization
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec nx serve api > api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat api-smoke.log' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health/live >/dev/null &&
               curl --fail --silent http://127.0.0.1:3001/api/v1/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo 'API readiness smoke test timed out.' >&2
            exit 1
          fi

          rules_list_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             'http://127.0.0.1:3001/api/v1/rules/snapshots?offset=0&limit=1')"
          [[ "$rules_list_status" == "401" ]]

          invalid_uuid_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             'http://127.0.0.1:3001/api/v1/rules/snapshots/not-a-uuid')"
          [[ "$invalid_uuid_status" == "401" ]]

          missing_snapshot_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             'http://127.0.0.1:3001/api/v1/rules/snapshots/00000000-0000-4000-8000-000000000000')"
          [[ "$missing_snapshot_status" == "401" ]]

          import_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             --request POST             'http://127.0.0.1:3001/api/v1/rules/snapshots/import')"
          [[ "$import_status" == "401" ]]

          authoring_list_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:3001/api/v1/rules/authoring/drafts?offset=0&limit=1')"
          [[ "$authoring_list_status" == "401" ]]

          authoring_invalid_uuid_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:3001/api/v1/rules/authoring/drafts/not-a-uuid')"
          [[ "$authoring_invalid_uuid_status" == "401" ]]

          authoring_create_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"fileName":"4300-smoke_rules.xml","tenant":"smoke","sourceType":"rules"}' \
            'http://127.0.0.1:3001/api/v1/rules/authoring/drafts/new')"
          [[ "$authoring_create_status" == "401" ]]

          token_endpoint='http://127.0.0.1:8080/realms/mercure-e2e/protocol/openid-connect/token'

          user_response="$(curl --fail --silent \
            --request POST \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=password' \
            --data-urlencode 'client_id=mercure-e2e' \
            --data-urlencode 'username=mercure-user' \
            --data-urlencode 'password=mercure-user-e2e-password' \
            "$token_endpoint")"
          user_token="$(node -e "const chunks=[];process.stdin.on('data',c=>chunks.push(c)).on('end',()=>{const value=JSON.parse(Buffer.concat(chunks).toString('utf8')).access_token;if(!value)process.exit(1);process.stdout.write(value)})" <<<"$user_response")"

          admin_response="$(curl --fail --silent \
            --request POST \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=password' \
            --data-urlencode 'client_id=mercure-e2e' \
            --data-urlencode 'username=mercure-admin' \
            --data-urlencode 'password=mercure-admin-e2e-password' \
            "$token_endpoint")"
          admin_token="$(node -e "const chunks=[];process.stdin.on('data',c=>chunks.push(c)).on('end',()=>{const value=JSON.parse(Buffer.concat(chunks).toString('utf8')).access_token;if(!value)process.exit(1);process.stdout.write(value)})" <<<"$admin_response")"

          user_read_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "authorization: Bearer $user_token" \
            'http://127.0.0.1:3001/api/v1/rules/snapshots?offset=0&limit=1')"
          [[ "$user_read_status" == "200" ]]

          user_admin_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "authorization: Bearer $user_token" \
            'http://127.0.0.1:3001/api/v1/rules/authoring/drafts?offset=0&limit=1')"
          [[ "$user_admin_status" == "403" ]]

          admin_read_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "authorization: Bearer $admin_token" \
            'http://127.0.0.1:3001/api/v1/rules/snapshots?offset=0&limit=1')"
          [[ "$admin_read_status" == "200" ]]

          admin_authoring_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "authorization: Bearer $admin_token" \
            'http://127.0.0.1:3001/api/v1/rules/authoring/drafts?offset=0&limit=1')"
          [[ "$admin_authoring_status" == "200" ]]

      - name: Set up pinned Chrome and ChromeDriver for browser authentication
        id: setup-auth-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 153.0.8010.52
          install-chromedriver: true

      - name: Verify browser Keycloak authentication
        shell: bash
        env:
          NODE_ENV: development
          API_CORS_ORIGINS: http://127.0.0.1:3000
          AUTH_SECRET: mercure-browser-e2e-auth-secret-not-a-production-secret-000000
          AUTH_URL: http://127.0.0.1:3000
          AUTH_TRUST_HOST: 'true'
          AUTH_KEYCLOAK_ID: mercure-web-e2e
          AUTH_KEYCLOAK_SECRET: mercure-web-e2e-secret
          AUTH_KEYCLOAK_ISSUER: http://127.0.0.1:8080/realms/mercure-e2e
          WEB_AUTH_AUTHORITY_CLIENT_ID: mercure-api
          WEB_AUTH_ADMIN_AUTHORITIES: admin
          WEB_AUTH_USER_AUTHORITIES: user
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
          CHROME_PATH: ${{ steps.setup-auth-chrome.outputs.chrome-path }}
          E2E_WEB_URL: http://127.0.0.1:3000
          E2E_USERNAME: mercure-user
          E2E_PASSWORD: mercure-user-e2e-password
        run: |
          set -euo pipefail

          pnpm exec nx serve api > api-browser-e2e.log 2>&1 &
          api_pid=$!
          pnpm exec nx run web:dev --port=3000 > web-browser-e2e.log 2>&1 &
          web_pid=$!
          chromedriver --port=9515 --log-path=chromedriver-browser-e2e.log >/dev/null 2>&1 &
          driver_pid=$!

          cleanup() {
            kill "$driver_pid" "$web_pid" "$api_pid" 2>/dev/null || true
            cat api-browser-e2e.log 2>/dev/null || true
            cat web-browser-e2e.log 2>/dev/null || true
            cat chromedriver-browser-e2e.log 2>/dev/null || true
          }
          trap cleanup EXIT

          api_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health/live >/dev/null &&
               curl --fail --silent http://127.0.0.1:3001/api/v1/health/ready >/dev/null; then
              api_ready=1
              break
            fi
            sleep 1
          done
          [[ "$api_ready" == "1" ]]

          web_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/auth/sign-in >/dev/null; then
              web_ready=1
              break
            fi
            sleep 1
          done
          [[ "$web_ready" == "1" ]]

          driver_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9515/status >/dev/null; then
              driver_ready=1
              break
            fi
            sleep 1
          done
          [[ "$driver_ready" == "1" ]]

          node scripts/ci/verify-browser-auth-e2e.mjs

      - name: Stop disposable Keycloak
        if: always()
        shell: bash
        run: |
          docker logs mercure-keycloak-e2e 2>&1 || true
          docker rm --force mercure-keycloak-e2e >/dev/null 2>&1 || true
