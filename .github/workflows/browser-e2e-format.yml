name: Browser E2E formatter

on:
  push:
    branches:
      - test/browser-keycloak-e2e

permissions:
  contents: write

jobs:
  format:
    name: Format browser E2E driver
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format browser E2E driver
        run: pnpm exec prettier --write scripts/ci/verify-browser-auth-e2e.mjs

      - name: Commit formatted driver
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- scripts/ci/verify-browser-auth-e2e.mjs; then
            echo 'Browser E2E driver is already formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/verify-browser-auth-e2e.mjs
          git commit -m 'test:identity:format-browser-auth-driver'
          git push origin HEAD:test/browser-keycloak-e2e
