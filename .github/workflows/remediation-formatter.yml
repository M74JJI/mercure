name: Remediation formatter

on:
  push:
    branches:
      - fix/audit-findings-remediation

permissions:
  contents: write

jobs:
  format:
    name: Format remediation file
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: pnpm exec prettier --write libs/modules/rules/backend/infrastructure/src/lib/filesystem-manager-archive-source.ts

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- libs/modules/rules/backend/infrastructure/src/lib/filesystem-manager-archive-source.ts; then
            echo 'File already matches repository formatting.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add libs/modules/rules/backend/infrastructure/src/lib/filesystem-manager-archive-source.ts
          git commit -m 'fix:rules:apply-prettier-to-archive-source'
          git push origin HEAD:fix/audit-findings-remediation
