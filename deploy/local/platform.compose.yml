services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: mercure
      POSTGRES_USER: mercure
      POSTGRES_PASSWORD: mercure-local
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mercure -d mercure']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mercure-postgres-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: mercure-local-admin
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ../../tests/e2e/keycloak/mercure-realm.json:/opt/keycloak/data/import/mercure-realm.json:ro

volumes:
  mercure-postgres-data:
