packages:
  - apps/*
  - libs/**
  - tools/*

# Reproducibility and dependency correctness.
engineStrict: true
saveExact: true
strictPeerDependencies: true
autoInstallPeers: false
sharedWorkspaceLockfile: true
preferWorkspacePackages: true
verifyStoreIntegrity: true

# Force reviewed patched transitive versions where an upstream package has not
# yet moved its exact dependency. Keep each override exact and remove it once
# the upstream dependency graph resolves an equally patched version by default.
overrides:
  fastify: 5.12.5
  smol-toml: 1.7.1

# Do not install optional build systems we do not use. @nx/react is pulled by
# @nx/next and declares @nx/vite as optional; Mercure uses Next.js, not Vite.
ignoredOptionalDependencies:
  - '@nx/vite'

# Supply-chain guardrail: newly published dependency versions are quarantined
# for seven days by default. Security exceptions are exact-version scoped,
# documented under security/policies, and removed after they mature.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.5'
  - '@nestjs/core@11.2.5'
  - '@nestjs/platform-fastify@11.2.5'
  - '@fastify/middie@9.3.4'
  - 'fastify@5.12.5'
  - 'next@16.3.6'
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'

# Dependency lifecycle scripts are denied unless an exact reviewed package
# version is explicitly permitted here. Explicit false entries record reviewed
# scripts that Mercure intentionally refuses to execute.
allowBuilds:
  'nx@23.2.1': true
  '@parcel/watcher@2.6.0': true
  'unrs-resolver@1.12.2': true
  '@scarf/scarf@1.4.0': false
  'esbuild@0.28.2': true
  '@prisma/engines@7.10.0': true
  'prisma@7.10.0': false
